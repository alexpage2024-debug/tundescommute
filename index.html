<!DOCTYPE html>

<style>
:root{--bg:#050b17;--fg:#f4f1e8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(()=>{
const W=960,H=540,G=420,HX=170;
const Q=Math.min(2,Math.max(1,window.devicePixelRatio||1));
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W*Q;cv.height=H*Q;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',fit);fit();
function mk(w,h){const c=document.createElement('canvas');c.width=w*Q;c.height=h*Q;const x=c.getContext('2d');x.scale(Q,Q);return [c,x]}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
let seed=11;const srnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const lerp=(a,b,p)=>a+(b-a)*p;

/* ---------- characters ---------- */
const CHARS=[
 {name:'DEVON', key:'D',skin:'#8a5a3c',skinD:'#734a31',hair:'#120a06',style:'hightop',zip:'#7a1f3d',zipL:'#962a4d',zipD:'#561530',arm:'#69192f',act:'phone'},
 {name:'TUNDE', key:'T',skin:'#6b4430',skinD:'#5a3825',hair:'#150c07',style:'dreads', zip:'#1b2f6b',zipL:'#223a82',zipD:'#14224d',arm:'#162760',act:'coffee'},
 {name:'MARCUS',key:'M',skin:'#4a2e1f',skinD:'#3b2418',hair:'#0d0705',style:'afro',   zip:'#1f6b45',zipL:'#27845a',zipD:'#154a30',arm:'#1a5a3a',act:'watch'},
 {name:'KOFI',  key:'K',skin:'#5e3b28',skinD:'#4d2f20',hair:'#0d0705',style:'beard',  zip:'#c9622a',zipL:'#de7538',zipD:'#8f4119',arm:'#b0541f',act:'eat'}
];
const KEYC={KeyD:0,KeyT:1,KeyM:2,KeyK:3};
let sel=1;

/* ---------- pre-rendered scenery ---------- */
const LW=1920,LH=400;
const [mid,mx]=mk(LW,LH);
function grid(c,x,y,w,h,col,step){c.strokeStyle=col;c.lineWidth=1;c.beginPath();for(let i=x+step;i<x+w;i+=step){c.moveTo(i,y);c.lineTo(i,y+h)}for(let j=y+step;j<y+h;j+=step){c.moveTo(x,j);c.lineTo(x+w,j)}c.stroke()}
function lights(c,x,y,w,h,step){for(let i=x+4;i<x+w-6;i+=step)for(let j=y+8;j<y+h-6;j+=step){if(srnd()<.14){c.fillStyle='rgba(255,214,120,'+(.3+srnd()*.4)+')';c.fillRect(i,j,step-8,step-9)}}}
const TW=[[20,90,170],[130,110,250],[260,120,210,'hs'],[400,130,290,'nf'],[560,170,330,'oc'],[760,120,240],[900,100,190],[1020,140,300],[1180,130,260],[1330,90,170],[1440,120,220],[1580,130,300],[1730,130,200]];
TW.forEach(([x,w,h,k])=>{
  const y=LH-h;let g;
  if(k==='oc'){
    g=mx.createLinearGradient(0,y,0,LH);g.addColorStop(0,'#d5dde9');g.addColorStop(1,'#74869f');
    mx.fillStyle=g;mx.fillRect(x,y,w,h);grid(mx,x,y,w,h,'rgba(0,0,0,.2)',10);
    mx.fillStyle='#e6ecf5';mx.beginPath();mx.moveTo(x,y);mx.lineTo(x+w/2,y-50);mx.lineTo(x+w,y);mx.closePath();mx.fill();
  }else if(k==='nf'){
    mx.save();mx.beginPath();mx.moveTo(x,y+14);mx.lineTo(x+14,y);mx.lineTo(x+w-14,y);mx.lineTo(x+w,y+14);mx.lineTo(x+w,LH);mx.lineTo(x,LH);mx.closePath();mx.clip();
    g=mx.createLinearGradient(0,y,0,LH);g.addColorStop(0,'#7aa0c4');g.addColorStop(1,'#2b4768');mx.fillStyle=g;mx.fillRect(x,y,w,h);
    mx.strokeStyle='rgba(215,232,255,.85)';mx.lineWidth=2;mx.beginPath();
    for(let i=-h;i<w+h;i+=30){mx.moveTo(x+i,y);mx.lineTo(x+i+h*.62,LH);mx.moveTo(x+i+h*.62,y);mx.lineTo(x+i,LH)}
    mx.stroke();mx.restore();
  }else{
    g=mx.createLinearGradient(0,y,0,LH);g.addColorStop(0,'#4a6ba8');g.addColorStop(1,'#14233f');
    mx.fillStyle=g;mx.fillRect(x,y,w,h);grid(mx,x,y,w,h,'rgba(255,255,255,.13)',10);lights(mx,x,y,w,h,10);
    if(k==='hs'){mx.fillStyle='#db0011';mx.fillRect(x+w/2-20,y+12,40,14);mx.fillStyle='#fff';mx.font='bold 10px Arial';mx.textAlign='center';mx.fillText('HSBC',x+w/2,y+23)}
  }
});
// line roundels on the towers: DLR, Jubilee, Elizabeth line
function roundel(c,x,y,col,label,txtCol,fs){
  c.strokeStyle=col;c.lineWidth=8;c.beginPath();c.arc(x,y,22,0,7);c.stroke();
  c.fillStyle=col;c.fillRect(x-30,y-7,60,14);
  c.fillStyle=txtCol;c.font='bold '+fs+'px Arial';c.textAlign='center';c.fillText(label,x,y+3.4);
}
roundel(mx,820,LH-90,'#00a4a7','DLR','#fff',10);
roundel(mx,1090,LH-90,'#9ba0a6','Jubilee','#10131c',9);
roundel(mx,1500,LH-90,'#6950a1','Elizabeth line','#fff',9);
const OCX=645,OCY=LH-330-52;
const [far,fx]=mk(1600,300);
for(let x=0;x<1600;){const w=50+srnd()*50,h=70+srnd()*170;fx.fillStyle='rgba(18,32,60,.95)';fx.fillRect(x,300-h,w,h);x+=w+6+srnd()*10}
const [pat,px]=mk(260,28);
px.fillStyle='#202c52';px.fillRect(0,0,260,28);
px.fillStyle='#f4f4f4';px.beginPath();px.moveTo(10,0);px.lineTo(70,0);px.lineTo(40,28);px.fill();
px.fillStyle='#3fa86e';px.beginPath();px.moveTo(70,28);px.lineTo(110,0);px.lineTo(150,28);px.fill();
px.strokeStyle='#d23fa8';px.lineWidth=7;px.beginPath();px.arc(174,28,24,Math.PI,0);px.stroke();
px.fillStyle='#7fb4f0';px.beginPath();px.moveTo(200,0);px.lineTo(250,0);px.lineTo(225,24);px.fill();
px.strokeStyle='#ff7fc6';px.lineWidth=5;px.beginPath();px.arc(24,28,16,Math.PI,0);px.stroke();
px.fillStyle='#f4f4f4';px.beginPath();px.moveTo(232,28);px.lineTo(260,6);px.lineTo(260,28);px.fill();

/* ---------- audio ---------- */
let ac,mg,nb,musicK=0,nextBar=0;
function initAudio(){
  if(ac){if(state!=='pause'&&ac.resume)ac.resume();return}
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);
    nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextBar=ac.currentTime+.1;setInterval(sched,200);sched();
  }catch(e){ac=null}
}
try{initAudio()}catch(e){}
function tone(f,t,d,type,v,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||mg);o.start(t);o.stop(t+d+.02)}
function nz(t,d,v,hp){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t,0,Math.min(d+.05,.9))}
const E=82.41,BASS=[E,0,E,E*2,0,E,0,E*1.5,E*1.33,0,E*1.33,0,E*1.5,E*1.33,E,0],CH=[[329.6,392,493.9,587.3],[293.7,349.2,440,523.3]];
function bar(t,k){const sp=60/112/4;
  for(let i=0;i<16;i++){const tt=t+i*sp;
    if(BASS[i]){tone(BASS[i],tt,sp*1.6,'sawtooth',.26);tone(BASS[i]*2,tt,.05,'square',.07)}
    if(i===0||i===8||i===10){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,tt);o.frequency.exponentialRampToValueAtTime(45,tt+.12);g.gain.setValueAtTime(.7,tt);g.gain.exponentialRampToValueAtTime(.001,tt+.18);o.connect(g);g.connect(mg);o.start(tt);o.stop(tt+.2)}
    if(i===4||i===12)nz(tt,.14,.32,1500);
    if(i%2===0)nz(tt,.04,.1,7000);
    if([2,3,6,11,14].includes(i)){const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=6;f.frequency.setValueAtTime(500,tt);f.frequency.exponentialRampToValueAtTime(2200,tt+.09);f.connect(mg);CH[(k>>1)%2].forEach(fr=>tone(fr,tt,.1,'sawtooth',.045,f))}
  }}
function sched(){if(!ac)return;while(nextBar<ac.currentTime+.5){bar(nextBar,musicK++);nextBar+=60/112*4}}
function sfx(k){if(!ac)return;const t=ac.currentTime;
  if(k==='jump'){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(780,t+.13);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.18)}
  if(k==='coin'){tone(988,t,.08,'square',.1);tone(1319,t+.07,.2,'square',.1)}
  if(k==='crash'){nz(t,.6,.6,300);tone(110,t,.5,'sawtooth',.3)}
  if(k==='thunder'){nz(t,.15,.9,900);nz(t+.05,1,.7,60);tone(55,t+.05,.9,'sawtooth',.35)}
  if(k==='buzz'){tone(150,t,.18,'sawtooth',.2);tone(150,t+.24,.3,'sawtooth',.2)}
  if(k==='buy'){tone(1318,t,.07,'square',.09);tone(1760,t+.07,.07,'square',.09);tone(2093,t+.14,.2,'square',.09)}
  if(k==='siren'){tone(740,t,.3,'sine',.1);tone(990,t+.3,.3,'sine',.1)}
  if(k==='tap'){tone(1760,t,.08,'sine',.2);tone(1760,t+.11,.12,'sine',.2)}}

/* ---------- game state ---------- */
const LOAD_T=4.6;
let state='load',loadT=0,mode='track',pf=0,dist=0,spd=340,coins=0,spent=0,time=0,uiT=0,best=0,newBest=false;
let hy=G,vy=0,air=false,held=false,jbuf=0,spawnT=1.4,obs=[],shops=[],shopT=8,pops=[],notes=[],overT=0,overDelay=0,overCause='',msg='',overTitle='',rain=[],hits=[],bolt=null;
let trackT=0,nextPlat=90,plan=[],planI=0,banner=0,bannerTxt='',bannerSub='',tapT=0,tipKind='';
let jetT=0,skyT=0,downK=false,scT=0,freeT=0,stamps=0,tH=58,tubeKind='jub',lastTube='',power=0,siren=0,sirenT=0,coy=0,cheated=false,health=null,healthT=25,nextTube=true,tubeEnd=false,subT=18,slapT=-1,rd=0,ug=0,sizeT=0,peak=0,due=false,roadSeen=false,nextRoad=true,lockJ=false,autoJ=false,roadT=0,roadLen=26,tubeT=0,tubeLen=28;
const skyO={x:0,len:0,type:'sky',coin:[]};
const SZ=9,BANKS=[{n:'Monzo',c:'#ff4f40',l:'M'},{n:'HSBC',c:'#db0011',l:'H'},{n:'AMEX',c:'#006fcf',l:'A'}];
const lvl=v=>v>=1000?2:v>=500?1:0,bk=()=>BANKS[lvl(peak)];
const SH={tesco:{p:3,t:'Tesco',s:'Meal Deal'},pret:{p:2,t:'Pret A Manger',s:'Coffee'},sbux:{p:5,t:'Starbucks',s:'Matcha Croissant'}};
const CARC=['#1b1e27','#2a5fa8','#e9ecf2','#c9a227','#3a8f4f','#8a2fa8'];
const TKEY='tunde_tips_seen';
let tips={shop:false,gate:false};
best=0;
const fmt=v=>{const r=Math.round(v*100)/100;return Number.isInteger(r)?''+r:r.toFixed(2)};
try{const t=JSON.parse(localStorage.getItem(TKEY)||'{}');tips.shop=!!t.shop;tips.gate=!!t.gate}catch(e){}
for(let i=0;i<70;i++)rain.push([Math.random()*W,Math.random()*H,6+Math.random()*10]);
const TS=150,GRAV=2300,V0=-860,ESC_WALK=2.2;
const OVER_TRAIN=['Mind the gap!','Signal failure at Heron Quays.','Delayed. Again.','Not the Elizabeth line.','Rail replacement bus, bruv.','The 8:47 waits for no quarter-zip.'];
const OVER_BENCH=['Mind the bench!','Somebody was sitting there.','Hybrid working: stay home next time.'];
const OVER_GATE=['%1 should have tapped in.','Revenue protection says no.','Insufficient tapping.','Please see a member of staff.'];
const OVER_LIGHT=['%1 skipped lunch. Zeus was hungry.','Meal deal or die.','Should have bought the coffee.','The weather app did say “thunder”.'];
const OVER_VEH=['Mind the bus!','Not the cycle lane, bruv.','The 135 does not stop for quarter-zips.','Should have used the pavement.'];
const OVER_SHOCK=['%1 found the live rail. 630 volts of Monday.','Mind the live rail!','Shocking performance.','Current delays on the Jubilee line.','That was not a DLR track, bruv.'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nm=()=>CHARS[sel].name[0]+CHARS[sel].name.slice(1).toLowerCase();
function reset(){stamps=0;scT=0;freeT=0;dist=0;spd=340;coins=0;spent=0;time=0;hy=G;vy=0;air=false;jbuf=0;spawnT=1.3;obs=[];shops=[];shopT=8;pops=[];notes=[];held=false;newBest=false;mode='track';pf=0;trackT=0;nextPlat=90;banner=0;tapT=0;bolt=null;rd=0;ug=0;sizeT=0;peak=0;due=false;roadSeen=false;nextRoad=true;lockJ=false;autoJ=false;slapT=-1;nextTube=true;tubeEnd=false;subT=18;cheated=false;siren=0;power=0;health=null;healthT=25;coy=0;lastTube='';jetT=0;skyT=0;skyO.coin=[];skyO.x=0;downK=false}
function start(){initAudio();if(state==='over')commitBest();reset();state='play'}
function pause(){if(state!=='play')return;state='pause';held=false;if(ac&&ac.suspend)ac.suspend()}
function unpause(){if(state!=='pause')return;state='play';held=false;if(ac&&ac.resume)ac.resume()}
function commitBest(){if(coins>best)best=coins}
function toMenu(){if(state==='pause'||state==='over')commitBest();if(state==='pause'&&ac&&ac.resume)ac.resume();state='title';siren=0;power=0;health=null;jetT=0;skyO.coin=[];obs=[];shops=[];pops=[];notes=[];held=false;mode='track';pf=0;bolt=null;rd=0;ug=0;sizeT=0;lockJ=false;slapT=-1}
function jumpPress(){if(lockJ)return;held=true;jbuf=.12}
function release(){held=false}
function startTip(k){tipKind=k;tips[k]=true;state='tip';held=false;try{localStorage.setItem(TKEY,JSON.stringify(tips))}catch(e){}}
function endTip(){if(state==='tip'){state='play';held=false}}

/* ---------- shops / barrier actions ---------- */
function nearShop(){for(const s of shops)if(!s.used&&s.x<HX+420&&s.x+s.w>HX-40)return s;return null}
function nearGate(){for(const o of obs)if(o.type==='gate'&&!o.tapped&&o.x-HX<460&&o.x+o.len>HX)return o;return null}
function price(s){return SH[s.kind].p}
function buy(){
  if(state!=='play')return;
  const s=nearShop();if(!s)return;
  let p=price(s),sub=SH[s.kind].s,free=false;
  if(s.kind==='pret'){
    if(stamps>=9){free=true;p=0;stamps=0;scT=3.5;freeT=1.8}
    else{if(coins<p)return;stamps++;scT=3.5}
      }else if(coins<p)return;
  coins=Math.round((coins-p)*100)/100;spent+=p;s.used=true;sfx('buy');
  notes.push({t:0,title:SH[s.kind].t,sub,amt:free?'£0.00':'-£'+p+'.00'});
  if(notes.length>3)notes.shift();
  pops.push({x:HX+30,y:G-165,t:0,s:free?'FREE COFFEE!':'-£'+p,col:free?'#7dff9c':'#ff8a7a'});
}
function tap(){
  if(state!=='play')return;
  tapT=.45;
  const g=nearGate();
  if(g){g.tapped=true;sfx('tap');pops.push({x:HX+30,y:G-130,t:0,s:'TAPPED IN',col:'#7dff9c'});const f=Math.min(coins,2.2);if(f>0){coins=Math.round((coins-f)*100)/100;spent+=f;notes.push({t:0,title:'Transport for London',sub:'Tap in',amt:'-£'+f.toFixed(2)});if(notes.length>3)notes.shift();pops.push({x:HX+30,y:G-165,t:0,s:'-£'+f.toFixed(2),col:'#ff8a7a'})}}
  buy();
}

addEventListener('keydown',e=>{
  const c=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
  initAudio();
  if(state==='load'){if(!e.repeat&&loadT>1.2&&(c==='Space'||c==='Enter'))state='title';return}
  if(c==='Escape'){
    if(!e.repeat){if(state==='play')pause();else if(state==='pause')unpause();else if(state==='over')toMenu()}
    return;
  }
  if((c==='Digit1'||c==='Numpad1')&&!e.repeat&&state==='play'){cheated=true;coins+=100;pops.push({x:HX+30,y:G-130,t:0,s:'+£100 CHEAT',col:'#7dff9c'});sfx('coin');return}
  if(c==='KeyR'&&!e.repeat&&state==='over'){cheatR();return}
  if((state==='title'||state==='pause'||state==='over')&&c in KEYC){sel=KEYC[c];return}
  if(state==='tip'){if((c==='Space'||c==='Enter')&&!e.repeat)endTip();return}
  if(state==='title'){
    if((c==='Space'||c==='Enter')&&!e.repeat)start();
    else if(c==='ArrowLeft')sel=(sel+3)%4;
    else if(c==='ArrowRight')sel=(sel+1)%4;
  }else if(state==='pause'){
    if((c==='Space'||c==='Enter')&&!e.repeat)unpause();
    else if(c==='ArrowLeft')sel=(sel+3)%4;
    else if(c==='ArrowRight')sel=(sel+1)%4;
  }else if(state==='over'){
    if((c==='Space'||c==='Enter')&&!e.repeat&&overT>overDelay+.4)start();
    else if(overT>=overDelay&&c==='ArrowLeft')sel=(sel+3)%4;
    else if(overT>=overDelay&&c==='ArrowRight')sel=(sel+1)%4;
  }else if(state==='play'){
    if((c==='Space'||c==='ArrowUp'||c==='KeyW')&&!e.repeat)jumpPress();
    
    else if(c==='KeyC'&&!e.repeat)tap();
    else if(c==='KeyS'||c==='ArrowDown'){downK=true;if(!e.repeat)zap()}
  }
});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release();if(e.code==='KeyS'||e.code==='ArrowDown')downK=false});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.fn();return}}
  if(state==='load'){if(loadT>1.2)state='title';return}
  if(state==='play')jumpPress();
});
addEventListener('pointerup',release);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('blur',pause);

/* ---------- obstacles ---------- */
function overlapX(o){const l=HX-11,r=HX+13;return r>o.x+6&&l<o.x+o.len-6}
function spawnTrain(j){
  const rel=spd+TS,maxLen=rel*.7-80;
  const maxCars=Math.max(1,Math.min(3,Math.floor((maxLen+3)/135)));
  const cars=1+Math.floor(Math.random()*maxCars),len=cars*135-3;
  const t={type:'train',x:W+40,cars,len,h:54,vs:TS,j:!!j,coin:[]};
  if(Math.random()<.85){const n=cars===1?5:6+cars;for(let i=0;i<n;i++){const u=i/(n-1);t.coin.push({dx:12+u*(len-30),y:G-105-Math.sin(u*Math.PI)*38,got:false})}}
  coinsFor(t.coin);obs.push(t);
  spawnT=len/rel+.85+Math.random()*.9;
}
function spawnPlat(k){
  if(k==='g'){obs.push({type:'gate',x:W+60,len:56,h:999,tapped:false,open:0,coin:[]});spawnT=56/spd+1.5+Math.random()*.5;return}
  const n=Math.random()<.3?2:1,len=n*92-4;

      const fa=Math.min(1,(overT-overDelay)*3);
      c.save();c.globalAlpha=fa;
      c.fillStyle=(overCause==='lightning'||overCause==='shock')?'rgba(8,16,44,.78)':overCause==='gate'?'rgba(10,18,44,.78)':'rgba(60,0,0,.7)';c.fillRect(0,0,W,H-26);
      txt(c,overTitle,W/2,72,46,(overCause==='lightning'||overCause==='shock')?'#ffe14d':'#ff5a5f','center');
      txt(c,msg,W/2,106,20,'#fff','center');
      txt(c,bk().n.toUpperCase()+'  £'+fmt(coins),W/2,150,34,'#ffb81c','center');
      if(newBest)txt(c,'NEW HIGH SCORE!',W/2,180,18,'#7dff9c','center');else txt(c,'HIGH SCORE: £'+fmt(best),W/2,180,16,'#cfd6e4','center');
      cards(c,196,168,.95,()=>{if(overT>overDelay+.4)start()});
      button(c,'PLAY AGAIN',W/2-130,376,260,46,()=>{if(overT>overDelay+.4)start()},true);
      button(c,'MAIN MENU',W/2-100,432,200,36,toMenu,false);
      txt(c,'SPACE to go again  ·  D · T · M · K swap  ·  ESC menu',W/2,484,13,'#8f9bb5','center');
      c.restore();
    }
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();drawHint(ctx);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
